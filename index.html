<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家書 Jiashu｜用一段話畫出一個家</title>
    <link rel="stylesheet" href="base.css">
    <link rel="stylesheet" href="grammar.css">
    <link rel="stylesheet" href="person.css">
    <link rel="stylesheet" href="relationship.css">
    <link rel="stylesheet" href="treeSelector.css">
    <link rel="stylesheet" href="metadata.css">
    <link rel="stylesheet" href="ai.css">
    <link rel="stylesheet" href="theme.css">

    <meta name="description" content="家書 Jiashu：用一段話描述家庭，自動畫出研究用家系圖。">
    <meta name="theme-color" content="#3B2F27">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png">
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <meta property="og:title" content="家書 Jiashu｜用一段話畫出一個家">
    <meta property="og:description" content="用一段話描述家庭，自動畫出研究用家系圖。">
    <meta property="og:image" content="assets/icons/icon-512.png">
</head>
<body>

    <div id="main-app-content">
        <header id="app-header">
            <div class="header-left">
                <span class="app-title">家書 Jiashu｜用一段話畫出一個家</span>
            </div>

            <nav id="view-switcher" class="desktop-view-switcher">
                <button class="tab-btn active" data-view="canvas"><img class="tab-icon" src="assets/cats/cat-4-sm.webp" width="20" height="20" alt="">畫布</button>
                <button class="tab-btn" data-view="editor"><img class="tab-icon" src="assets/cats/cat-7-sm.webp" width="20" height="20" alt="">編輯</button>
            </nav>

            <div id="mobile-view-switcher" class="mobile-view-switcher">
                <button id="mobile-view-toggle-btn" class="mobile-view-toggle-btn">
                    <span id="current-mobile-view-label">畫布</span> <span class="dropdown-arrow">▼</span>
                </button>
                <div id="mobile-view-options" class="mobile-view-options">
                    <a href="#" class="mobile-view-option" data-view="canvas"><img class="tab-icon" src="assets/cats/cat-4-sm.webp" width="18" height="18" alt="">畫布</a>
                    <a href="#" class="mobile-view-option" data-view="editor"><img class="tab-icon" src="assets/cats/cat-7-sm.webp" width="18" height="18" alt="">家書編輯器</a>
                </div>
            </div>

            <div class="header-right">
                <button id="theme-toggle-btn" class="theme-toggle-btn" type="button" title="切換淺色／深色模式" aria-label="切換淺色／深色模式">
                    <svg class="sun-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/><line x1="4.9" y1="4.9" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.1" y2="19.1"/><line x1="4.9" y1="19.1" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.1" y2="4.9"/></svg>
                    <svg class="moon-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
                </button>
                <button id="ai-settings-btn" class="ai-settings-btn" title="Google AI Studio API 設定">API 設定</button>
            </div>
        </header>

        <main id="view-container">
            <div id="family-tree-container" class="view-panel active">
                <p class="canvas-placeholder" style="text-align: center; padding-top: 50px; color: var(--text-color-secondary);">家系圖畫布區域</p>
            </div>
             <div id="ftdl-editor-view" class="view-panel">
                <!-- Error messages will be injected here by JS -->
                <div class="editor-controls-header">
                    <button id="execute-ftdl-btn" class="button">
                        執行
                    </button>
                    <button id="save-ftdl-btn" class="button button-secondary" style="margin-left: 10px;">
                        儲存
                    </button>
                </div>
                <div class="editor-container">
                    <div id="line-numbers"></div>
                    <textarea id="ftdl-editor" placeholder="在此輸入FTDL代碼..."></textarea>
                </div>
                <div id="suggestion-box" style="display: none;"></div>
            </div>
        </main>

        <!-- 助手對話區：點左下角的貓從下方拉出，左側可以展開聊天室清單 -->
        <section id="assistant-sheet" aria-label="助手對話">
            <div class="sheet-resizer" title="拖曳調整高度" aria-hidden="true"></div>
            <div class="sheet-inner">
                <aside class="sheet-rooms" aria-label="聊天室清單">
                    <div class="rooms-head">
                        <span class="rooms-title">聊天室</span>
                        <button type="button" class="rooms-new" title="開一個新的聊天室">＋ 新聊天室</button>
                    </div>
                    <ul class="rooms-list"></ul>
                    <div class="rooms-foot">最多 10 個聊天室，每個最多 20 筆對話</div>
                </aside>
                <div class="sheet-main">
                    <header class="sheet-head">
                        <button type="button" class="rooms-toggle" title="顯示／隱藏聊天室清單" aria-label="聊天室清單">☰</button>
                        <div class="sheet-title"></div>
                        <span class="chat-capacity"></span>
                        <button type="button" class="chat-load-latest" title="把這個聊天室最新的一份 FTDL 載入並畫出來">載入最新家系圖</button>
                        <button type="button" class="sheet-close" title="收起對話區" aria-label="收起對話區">⌄</button>
                    </header>
                    <div class="chat-notice" hidden></div>
                    <div class="chat-body"></div>
                    <div class="sheet-composer">
                        <div class="composer-mascot-slot"></div>
                        <div class="composer-column">
                            <div id="ai-status"></div>
                            <div class="composer-box">
                                <textarea id="user-text-input" rows="1"></textarea>
                                <div class="composer-row">
                                    <div id="ai-mode-toggle" role="group" aria-label="助手模式">
                                        <button type="button" data-mode="generate" title="直接把描述轉成家系圖">生成</button>
                                        <button type="button" data-mode="guide" title="由引導助手陪你一步步整理家庭故事">引導</button>
                                    </div>
                                    <span class="composer-hint">Enter 換行 · Shift+Enter 送出 · #編號 可提及</span>
                                    <button type="button" id="ai-handoff-btn" title="把這個聊天室目前的所有資訊交給生成助手，畫出家系圖">產生家系圖</button>
                                    <button type="button" id="run-dialogue-btn">送出</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <!-- 左下角的助手貓：點一下展開／收起對話區；等待回覆時會播放動畫 -->
    <button type="button" id="assistant-mascot" title="和助手對話" aria-label="和助手對話" aria-expanded="false">
        <img src="assets/cats/cat-1.webp" width="72" height="72" alt="">
    </button>
    <div id="assistant-bubble" role="status" aria-live="polite"></div>
    <script src="config.js"></script>
    <script src="base.js"></script>
    <script src="grammar.js"></script>
    <script src="person.js"></script>
    <script src="research.js"></script>
    <script src="relationship.js"></script>
    <script src="treeSelector.js"></script>
    <script src="metadata.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="ai.js"></script>
    <script src="decor.js"></script>

</body>
</html>
